- name: Install dependencies
        run: pip install requests cairosvg

      - name: Generate 3D PNG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'EOF'
          import requests, os, cairosvg

          token = os.environ["GITHUB_TOKEN"]
          username = "Ahsan-Khalid01"

          headers = {"Authorization": f"bearer {token}"}
          query = """
          {
            user(login: "%s") {
              contributionsCollection {
                contributionCalendar {
                  weeks {
                    contributionDays {
                      contributionCount
                      date
                    }
                  }
                }
              }
            }
          }
          """ % username

          r = requests.post("https://api.github.com/graphql",
                json={"query": query}, headers=headers)
          weeks = r.json()["data"]["user"]["contributionsCollection"]["contributionCalendar"]["weeks"]

          TW, TH = 14, 7
          BAR = 16
          OX = 420
          OY = 60
          W = 860
          H = 500

          def to_screen(c, r):
              x = OX + (c - r) * TW
              y = OY + (c + r) * TH
              return x, y

          def diamond(cx, cy, w, h):
              return f"M{cx},{cy-h} L{cx+w},{cy} L{cx},{cy+h} L{cx-w},{cy} Z"

          colors = ["#1c2128","#0e4429","#006d32","#26a641","#39d353"]
          side_l = ["#0d1117","#0a3320","#005128","#1e8033","#2db545"]
          side_r = ["#0d1117","#072b1a","#004422","#197029","#259c3a"]

          paths = []
          cells = []
          for ci, week in enumerate(weeks):
              for ri, day in enumerate(week["contributionDays"]):
                  cnt = day["contributionCount"]
                  v = 0 if cnt==0 else 1 if cnt<=1 else 2 if cnt<=3 else 3 if cnt<=6 else 4
                  cells.append((ci, ri, v))

          for ci, ri, v in reversed(cells):
              px, py = to_screen(ci, ri)
              bh = v * BAR
              col = colors[v]
              paths.append(f'<path d="{diamond(px,py,TW,TH)}" fill="{col}" stroke="#0d1117" stroke-width="0.8"/>')
              if v > 0:
                  paths.append(f'<path d="M{px-TW},{py} L{px},{py+TH} L{px},{py+TH-bh} L{px-TW},{py-bh} Z" fill="{side_l[v]}" stroke="#0d1117" stroke-width="0.5"/>')
                  paths.append(f'<path d="M{px},{py+TH} L{px+TW},{py} L{px+TW},{py-bh} L{px},{py+TH-bh} Z" fill="{side_r[v]}" stroke="#0d1117" stroke-width="0.5"/>')
                  paths.append(f'<path d="{diamond(px,py-bh,TW,TH)}" fill="{col}" stroke="#0d1117" stroke-width="0.5"/>')

          svg = f'''<svg width="{W}" height="{H}" xmlns="http://www.w3.org/2000/svg">
          <rect width="{W}" height="{H}" fill="#0d1117"/>
          {"".join(paths)}
          </svg>'''

          os.makedirs("profile-3d-contrib", exist_ok=True)
          with open("profile-3d-contrib/profile-night-green.svg", "w") as f:
              f.write(svg)
          cairosvg.svg2png(url="profile-3d-contrib/profile-night-green.svg",
                           write_to="profile-3d-contrib/profile-night-green.png",
                           output_width=860)
          print("Done!")
          EOF
